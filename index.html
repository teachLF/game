<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Saudi League 5 - DLS 26 Edition</title>
<style>
  html,body { height:100%; margin:0; background:#0b2b1a; font-family: "Segoe UI", Tahoma, Arial, sans-serif; color:#fff; overflow:hidden; }
  #ui { position: absolute; left: 12px; top: 12px; z-index: 20; width: 360px; }
  .panel { background: rgba(0,0,0,0.6); padding:12px; border-radius:8px; margin-bottom:10px; }
  .title { font-size:18px; font-weight:700; margin-bottom:8px; }
  .slots { display:flex; gap:8px; }
  .slot { width:48px; height:64px; background:#111; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-direction:column; font-size:12px; }
  .btn { background:#1e90ff; color:#fff; padding:8px 10px; border-radius:6px; cursor:pointer; display:inline-block; margin-top:8px; }
  #canvas { width:100%; height:100%; display:block; }
  #hud { position:absolute; right:12px; top:12px; z-index:20; text-align:right; }
  #message { position:absolute; left:50%; transform:translateX(-50%); top:20px; z-index:30; font-size:22px; padding:8px 14px; background:rgba(0,0,0,0.6); border-radius:8px; display:none; }
  #varOverlay { position:absolute; left:0; top:0; width:100%; height:100%; z-index:40; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #varOverlay .text { font-size:48px; color:#ffeb3b; text-shadow:0 0 12px #000; }
  #scoreboard { font-size:20px; padding:8px 12px; background:rgba(0,0,0,0.6); border-radius:8px; }
  .team-select { display:flex; gap:8px; flex-wrap:wrap; }
  .team-card { width:160px; padding:8px; background:#0b1f12; border-radius:8px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .team-card img { width:48px; height:48px; object-fit:contain; }
  #tifoCanvas { position:absolute; left:0; bottom:0; width:100%; height:40%; pointer-events:none; z-index:5; }
</style>

<!-- Importmap for Three.js and modules -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}

</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div id="startPanel" class="panel">
    <div class="title">Select Sides — Saudi League 5</div>
    <div style="margin-bottom:8px">Press <strong>X</strong> on a connected controller to join. Use D-pad left/right to choose <strong>LEFT</strong> or <strong>RIGHT</strong> side.</div>
    <div class="slots" id="controllerSlots"></div>
    <div style="margin-top:8px">
      <div class="title">Teams</div>
      <div class="team-select" id="teamSelect"></div>
    </div>
    <div style="margin-top:8px">
      <div class="title">Formations</div>
      <div style="display:flex; gap:8px;">
        <button class="btn" data-formation="4-4-2">4-4-2</button>
        <button class="btn" data-formation="4-3-3">4-3-3</button>
        <button class="btn" data-formation="3-5-2">3-5-2</button>
        <button class="btn" data-formation="5-3-2">5-3-2</button>
      </div>
    </div>
    <div style="margin-top:8px">
      <button id="startMatchBtn" class="btn">Start Match</button>
    </div>
  </div>

  <div id="hud" style="display:none">
    <div id="scoreboard" class="panel">
      <span id="teamLeftName">LEFT</span> <strong id="scoreLeft">0</strong> - <strong id="scoreRight">0</strong> <span id="teamRightName">RIGHT</span>
      <div id="time" style="font-size:14px; margin-top:6px">00:00</div>
    </div>
  </div>
</div>

<div id="message"></div>
<div id="varOverlay"><div class="text">VAR CHECK</div></div>

<canvas id="tifoCanvas"></canvas>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =========================
   CONFIG & ASSET LINKS
   ========================= */
const LOGO_URLS = {
  "Al Hilal": "https://upload.wikimedia.org/wikipedia/en/6/6f/Al-Hilal_SFC_logo.png",
  "Al Nassr": "https://upload.wikimedia.org/wikipedia/en/9/9b/Al-Nassr_FC_logo.png",
  "Al Qadisiyah": "https://upload.wikimedia.org/wikipedia/en/0/0b/Al-Qadsiah_Logo.png",
  "Al Ittihad": "https://upload.wikimedia.org/wikipedia/en/6/6b/Al-Ittihad_Club_logo.png",
  "Al Ahli Saudi": "https://upload.wikimedia.org/wikipedia/en/8/8b/Al-Ahli_Saudi_FC_logo.png"
};

const TEAM_COLORS = {
  "Al Hilal": { primary: 0x1e6fe0, secondary: 0xffffff },
  "Al Nassr": { primary: 0xffd400, secondary: 0x0033a0 },
  "Al Qadisiyah": { primary: 0xffd400, secondary: 0xd40000 },
  "Al Ittihad": { primary: 0xffd400, secondary: 0x000000 },
  "Al Ahli Saudi": { primary: 0xffffff, secondary: 0x007a3d }
};

const FORMATIONS = {
  "4-4-2": [1,4,4], // GK, DEF, MID, FWD (we will map to 5 players total)
  "4-3-3": [1,4,3],
  "3-5-2": [1,3,5],
  "5-3-2": [1,5,3]
};

/* =========================
   GLOBAL STATE
   ========================= */
const MAX_CONTROLLERS = 6;
let controllers = new Array(MAX_CONTROLLERS).fill(null).map((_,i)=>({
  index:i, connected:false, joined:false, side:null, gamepad:null, playerIndex:null
}));

let selectedTeams = { LEFT: null, RIGHT: null };
let selectedFormation = "4-4-2";
let matchRunning = false;
let matchTimeSeconds = 45 * 60; // default 45 minutes in seconds
let timeScale = 1; // 1 real second = 1 in-game minute => scale = 60; configurable below
let timeScaleConfig = 60; // default mapping: 1 real second = 1 in-game minute => 60x speed
let currentMatchSeconds = 0;
let addedTime = 0;
let varActive = false;

/* =========================
   UI SETUP
   ========================= */
const controllerSlotsEl = document.getElementById('controllerSlots');
const teamSelectEl = document.getElementById('teamSelect');
const startMatchBtn = document.getElementById('startMatchBtn');
const startPanel = document.getElementById('startPanel');
const hud = document.getElementById('hud');
const scoreLeftEl = document.getElementById('scoreLeft');
const scoreRightEl = document.getElementById('scoreRight');
const teamLeftNameEl = document.getElementById('teamLeftName');
const teamRightNameEl = document.getElementById('teamRightName');
const timeEl = document.getElementById('time');
const messageEl = document.getElementById('message');
const varOverlay = document.getElementById('varOverlay');
const tifoCanvas = document.getElementById('tifoCanvas');

function showMessage(text, ms=2000) {
  messageEl.style.display = 'block';
  messageEl.textContent = text;
  setTimeout(()=> messageEl.style.display = 'none', ms);
}

/* Controller slots UI */
function renderControllerSlots() {
  controllerSlotsEl.innerHTML = '';
  controllers.forEach((c,i)=>{
    const div = document.createElement('div');
    div.className = 'slot';
    div.id = 'slot-'+i;
    div.innerHTML = `<div style="font-size:11px">Pad ${i+1}</div>
                     <div style="font-size:10px; margin-top:6px">${c.connected ? (c.joined ? (c.side||'') : 'Connected') : '—'}</div>`;
    controllerSlotsEl.appendChild(div);
  });
}

/* Team selection UI */
function renderTeamSelect() {
  teamSelectEl.innerHTML = '';
  Object.keys(LOGO_URLS).forEach(team=>{
    const card = document.createElement('div');
    card.className = 'team-card';
    card.dataset.team = team;
    const img = document.createElement('img');
    img.src = LOGO_URLS[team];
    img.alt = team;
    const txt = document.createElement('div');
    txt.innerHTML = `<div style="font-weight:700">${team}</div><div style="font-size:12px">Colors</div>`;
    card.appendChild(img);
    card.appendChild(txt);
    card.onclick = ()=> {
      // assign to side selection: if both sides empty, assign to LEFT first
      if (!selectedTeams.LEFT) { selectedTeams.LEFT = team; teamLeftNameEl.textContent = team; card.style.outline='2px solid #1e90ff'; }
      else if (!selectedTeams.RIGHT && selectedTeams.LEFT !== team) { selectedTeams.RIGHT = team; teamRightNameEl.textContent = team; card.style.outline='2px solid #ffcc00'; }
      else {
        // toggle: if already selected, unselect
        if (selectedTeams.LEFT === team) { selectedTeams.LEFT = null; teamLeftNameEl.textContent = 'LEFT'; card.style.outline=''; }
        if (selectedTeams.RIGHT === team) { selectedTeams.RIGHT = null; teamRightNameEl.textContent = 'RIGHT'; card.style.outline=''; }
      }
    };
    teamSelectEl.appendChild(card);
  });
}

/* Formation buttons */
document.querySelectorAll('[data-formation]').forEach(btn=>{
  btn.addEventListener('click', ()=> {
    selectedFormation = btn.dataset.formation;
    showMessage('Formation set to ' + selectedFormation, 1500);
  });
});

/* Start match */
startMatchBtn.addEventListener('click', ()=> {
  if (!selectedTeams.LEFT || !selectedTeams.RIGHT) { showMessage('Select both teams first'); return; }
  startPanel.style.display = 'none';
  hud.style.display = 'block';
  matchRunning = true;
  initMatch();
});

/* initial render */
renderControllerSlots();
renderTeamSelect();

/* =========================
   GAMEPAD HANDLING
   ========================= */
window.addEventListener("gamepadconnected", (e) => {
  const gp = navigator.getGamepads()[e.gamepad.index];
  // find first free slot
  const free = controllers.find(c=>!c.connected);
  if (free) {
    free.connected = true;
    free.gamepad = gp;
    free.joined = false;
    showMessage(`Controller ${free.index+1} connected`);
    renderControllerSlots();
  } else {
    showMessage('Max controllers connected');
  }
});

window.addEventListener("gamepaddisconnected", (e) => {
  const idx = controllers.findIndex(c=>c.gamepad && c.gamepad.index === e.gamepad.index);
  if (idx>=0) {
    controllers[idx] = { index: idx, connected:false, joined:false, side:null, gamepad:null, playerIndex:null };
    renderControllerSlots();
    showMessage(`Controller ${idx+1} disconnected`);
  }
});

/* Poll gamepads for join and side selection */
function pollGamepadsForJoin() {
  const gps = navigator.getGamepads();
  controllers.forEach((c,i)=>{
    if (!c.connected) return;
    const gp = gps[c.index];
    if (!gp) return;
    // Buttons mapping for PS controllers: 0=X, 1=Circle, 2=Square, 3=Triangle, 4=L1, 5=R1, 6=L2, 7=R2, 8=Share, 9=Options, 12=DpadUp,13=DpadDown,14=DpadLeft,15=DpadRight
    // Join on X (button 0)
    if (!c.joined && gp.buttons[0].pressed) {
      c.joined = true;
      // default side: LEFT
      c.side = 'LEFT';
      showMessage(`Pad ${i+1} joined LEFT`);
      renderControllerSlots();
    }
    // If joined, allow D-pad left/right to change side
    if (c.joined) {
      if (gp.buttons[14] && gp.buttons[14].pressed) { c.side = 'LEFT'; renderControllerSlots(); }
      if (gp.buttons[15] && gp.buttons[15].pressed) { c.side = 'RIGHT'; renderControllerSlots(); }
      // After joining, allow player index selection with Dpad up/down
      if (gp.buttons[12] && gp.buttons[12].pressed) { c.playerIndex = Math.max(0, (c.playerIndex||0)-1); renderControllerSlots(); }
      if (gp.buttons[13] && gp.buttons[13].pressed) { c.playerIndex = Math.min(4, (c.playerIndex||0)+1); renderControllerSlots(); }
    }
  });
}

/* =========================
   THREE.JS SCENE SETUP
   ========================= */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 18, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.maxPolarAngle = Math.PI/2.2;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.enabled = false; // we'll use custom third-person camera

// Lights
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
hemi.position.set(0,50,0);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(10,20,10);
scene.add(dir);

/* Pitch */
const pitch = new THREE.Group();
const pitchGeo = new THREE.PlaneGeometry(40, 60);
const pitchMat = new THREE.MeshStandardMaterial({ color:0x0b7a3a });
const pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
pitchMesh.rotation.x = -Math.PI/2;
scene.add(pitchMesh);

/* Lines */
const lineMat = new THREE.LineBasicMaterial({ color:0xffffff });
function addLine(points) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(geo, lineMat);
  scene.add(line);
}
addLine([new THREE.Vector3(-20,0.01,-30), new THREE.Vector3(20,0.01,-30)]);
addLine([new THREE.Vector3(-20,0.01,30), new THREE.Vector3(20,0.01,30)]);
addLine([new THREE.Vector3(0,0.01,-30), new THREE.Vector3(0,0.01,30)]);
addLine([new THREE.Vector3(-20,0.01,0), new THREE.Vector3(20,0.01,0)]);

/* Goals */
function makeGoal(x) {
  const g = new THREE.Group();
  const postGeo = new THREE.BoxGeometry(0.3,2.4,0.3);
  const postMat = new THREE.MeshStandardMaterial({ color:0xffffff });
  const left = new THREE.Mesh(postGeo, postMat); left.position.set(x,1.2,-29.5);
  const right = left.clone(); right.position.set(x,1.2,-30.5);
  const cross = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x)*2-0.6,0.3,0.3), postMat); cross.position.set(0,2.4,-30);
  g.add(left,right,cross);
  scene.add(g);
}
makeGoal(-20);
makeGoal(20);

/* Ball */
const ballGeo = new THREE.SphereGeometry(0.5, 16, 16);
const ballMat = new THREE.MeshStandardMaterial({ color:0xffffff });
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.set(0,0.5,0);
scene.add(ball);

/* Player prototypes */
const playerGroup = new THREE.Group();
scene.add(playerGroup);

function createPlayerMesh(teamName, number=0) {
  const colors = TEAM_COLORS[teamName] || { primary:0x888888, secondary:0xffffff };
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 1.2, 4, 8), new THREE.MeshStandardMaterial({ color: colors.primary }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshStandardMaterial({ color: colors.secondary }));
  head.position.y = 1.2;
  body.add(head);
  const mesh = new THREE.Group();
  mesh.add(body);
  mesh.userData = { team: teamName, number };
  return mesh;
}

/* Teams & players state */
let teams = {
  LEFT: { name: null, players: [], score:0, formation: selectedFormation },
  RIGHT: { name: null, players: [], score:0, formation: selectedFormation }
};

/* Spawn players based on formation */
function spawnPlayers() {
  playerGroup.clear();
  teams.LEFT.players = [];
  teams.RIGHT.players = [];
  const leftName = selectedTeams.LEFT;
  const rightName = selectedTeams.RIGHT;
  teams.LEFT.name = leftName;
  teams.RIGHT.name = rightName;
  teamLeftNameEl.textContent = leftName;
  teamRightNameEl.textContent = rightName;

  function spawnSide(side, xSign) {
    const formation = FORMATIONS[selectedFormation];
    // formation array: [GK, DEF, MID/FWD counts] but we need total 5 players including GK
    // We'll map to positions: GK, defenders, midfielders, forwards until 5 players
    const counts = [];
    counts.push(1); // GK
    // flatten remaining counts until total 5
    let remaining = 4;
    // prefer defenders then midfield then forwards
    const def = Math.min(remaining, formation[1] || 2); counts.push(def); remaining -= def;
    const mid = Math.min(remaining, formation[2] || 2); counts.push(mid); remaining -= mid;
    const fwd = Math.max(0, remaining); counts.push(fwd);

    // compute positions along pitch
    const zPositions = [-26, -12, 0, 12, 26]; // relative to side
    let playerIndex = 0;
    // GK
    const teamName = side === 'LEFT' ? leftName : rightName;
    const colors = TEAM_COLORS[teamName] || { primary:0x888888, secondary:0xffffff };
    const keeper = createPlayerMesh(teamName, 1);
    keeper.position.set(xSign*18, 0.6, side==='LEFT' ? -26 : 26);
    keeper.userData = { role:'GK', team:teamName, rating: 85 + Math.floor(Math.random()*8), reaction: 0.2 + Math.random()*0.3 };
    playerGroup.add(keeper);
    teams[side].players.push(keeper);
    playerIndex++;

    // other players: spread across pitch
    const xBase = xSign * 10;
    const zSpread = side === 'LEFT' ? -10 : 10;
    for (let i=0;i<4;i++) {
      const p = createPlayerMesh(teamName, i+2);
      const z = -12 + i*6;
      p.position.set(xSign*(6 + Math.random()*6), 0.6, z);
      p.userData = { role:'OUT', team:teamName, aiState:'idle' };
      playerGroup.add(p);
      teams[side].players.push(p);
    }
  }

  spawnSide('LEFT', -1);
  spawnSide('RIGHT', 1);

  // place ball center
  ball.position.set(0,0.5,0);
}

/* =========================
   SIMPLE PHYSICS & AI
   ========================= */
let activePlayer = null;
let possession = null; // 'LEFT' or 'RIGHT' or null

function distance(a,b) {
  return a.position.distanceTo(b.position);
}

/* Basic AI tick for non-controlled players */
function aiTick(delta) {
  // simple behavior: chase ball if near, otherwise hold positions
  ['LEFT','RIGHT'].forEach(side=>{
    teams[side].players.forEach(p=>{
      if (p.userData.role === 'GK') {
        // goalkeeper AI: stay near goal, react to shots
        const goalZ = side === 'LEFT' ? -30 : 30;
        const goalX = side === 'LEFT' ? -18 : 18;
        // if ball near, attempt to intercept
        const d = p.position.distanceTo(ball.position);
        if (d < 8) {
          // move toward ball with limited speed
          const dir = new THREE.Vector3().subVectors(ball.position, p.position).setY(0).normalize();
          p.position.addScaledVector(dir, delta * 4);
        } else {
          // return to goal
          const target = new THREE.Vector3(goalX, 0.6, goalZ+2*(side==='LEFT'?1:-1));
          const dir = new THREE.Vector3().subVectors(target, p.position).setY(0);
          p.position.addScaledVector(dir.normalize(), delta * 2);
        }
      } else {
        // outfield players
        const d = p.position.distanceTo(ball.position);
        if (d < 3.5) {
          // try to take possession
          possession = side;
          activePlayer = p;
        } else {
          // roam around assigned zone
          // small random walk
          p.position.x += (Math.random()-0.5) * delta * 0.5;
          p.position.z += (Math.random()-0.5) * delta * 0.5;
        }
      }
    });
  });
}

/* Ball physics */
let ballVelocity = new THREE.Vector3(0,0,0);
function physicsTick(delta) {
  // simple friction
  ball.position.addScaledVector(ballVelocity, delta);
  ballVelocity.multiplyScalar(Math.max(0, 1 - delta*1.5));
  // collisions with players
  playerGroup.children.forEach(p=>{
    const d = p.position.distanceTo(ball.position);
    if (d < 1.0) {
      // transfer possession
      possession = p.userData.team === teams.LEFT.name ? 'LEFT' : 'RIGHT';
      activePlayer = p;
      // nudge ball
      const dir = new THREE.Vector3().subVectors(ball.position, p.position).normalize();
      ballVelocity.addScaledVector(dir, 6);
    }
  });
  // keep ball on pitch
  ball.position.x = THREE.MathUtils.clamp(ball.position.x, -19, 19);
  ball.position.z = THREE.MathUtils.clamp(ball.position.z, -29, 29);
}

/* Shooting and goalkeeper save logic */
function attemptShot(shooter, power=1.0) {
  // target is center of goal
  const shooterSide = shooter.userData.team === teams.LEFT.name ? 'LEFT' : 'RIGHT';
  const targetGoalX = shooterSide === 'LEFT' ? 20 : -20;
  const targetGoalZ = shooterSide === 'LEFT' ? 30 : -30;
  const dir = new THREE.Vector3(targetGoalX - shooter.position.x, 0, targetGoalZ - shooter.position.z).normalize();
  ballVelocity.copy(dir.multiplyScalar(10 * power));
  possession = null;
  activePlayer = null;

  // find opposing keeper
  const oppSide = shooterSide === 'LEFT' ? 'RIGHT' : 'LEFT';
  const keeper = teams[oppSide].players.find(p=>p.userData.role==='GK');
  if (!keeper) return;

  // compute time to goal and keeper reaction
  const distToGoal = ball.position.distanceTo(new THREE.Vector3(targetGoalX,0, targetGoalZ));
  const timeToGoal = distToGoal / (10 * power);
  const keeperReaction = keeper.userData.reaction + (Math.random()*0.2 - 0.1); // add randomness
  const keeperRating = keeper.userData.rating;
  // keeper attempts save if reaction < timeToGoal
  setTimeout(()=>{
    // compute save probability based on rating and shot power
    const baseSaveChance = (keeperRating - 70) / 40; // 0..~0.55
    const powerFactor = Math.max(0, 1 - power*0.6);
    const saveProb = THREE.MathUtils.clamp(baseSaveChance * powerFactor + Math.random()*0.2, 0, 0.95);
    if (Math.random() < saveProb) {
      // diving save: reflect ball
      ballVelocity.multiplyScalar(-0.5);
      showCommentary('تصدي رائع من الحارس');
      // small visual
      keeper.position.add(new THREE.Vector3((Math.random()-0.5)*2,0,(Math.random()-0.5)*2));
    } else {
      // goal
      registerGoal(shooterSide);
    }
  }, Math.max(100, keeperReaction*1000));
}

/* Register goal and trigger celebration */
function registerGoal(side) {
  teams[side].score++;
  if (side === 'LEFT') scoreLeftEl.textContent = teams.LEFT.score;
  else scoreRightEl.textContent = teams.RIGHT.score;
  showCommentary('هدف!');
  // crowd cheer
  playCrowdCheer();
  // reset ball and players
  setTimeout(()=> {
    ball.position.set(0,0.5,0);
    ballVelocity.set(0,0,0);
    possession = null;
  }, 1500);
}

/* =========================
   VAR SYSTEM
   ========================= */
function maybeTriggerVAR(goalScorerSide) {
  // Offside probability 40-60% for close calls
  const prob = 0.4 + Math.random()*0.2;
  if (Math.random() < prob) {
    // trigger VAR
    varActive = true;
    varOverlay.style.display = 'flex';
    showCommentary('VAR جاري التحقق');
    // slow time: 10 seconds = 1 real minute => timeScaleConfig adjust
    const prevTimeScale = timeScaleConfig;
    timeScaleConfig = 10;
    // show replay slow-mo: we simulate by pausing physics and showing camera replay
    setTimeout(()=>{
      // decide final decision: correct decision (no goal) or confirm goal
      const correct = Math.random() > 0.5;
      if (correct) {
        // confirm goal
        showCommentary('الحكم: الهدف صحيح');
        // keep goal already registered
      } else {
        // overturn goal
        showCommentary('الحكم: الهدف ملغي بسبب التسلل');
        // revert last goal
        if (teams[goalScorerSide].score > 0) {
          teams[goalScorerSide].score--;
          if (goalScorerSide === 'LEFT') scoreLeftEl.textContent = teams.LEFT.score;
          else scoreRightEl.textContent = teams.RIGHT.score;
        }
      }
      varActive = false;
      varOverlay.style.display = 'none';
      timeScaleConfig = prevTimeScale;
    }, 3000); // 3 second slow-mo
  }
}

/* =========================
   COMMENTARY (Web Speech API)
   ========================= */
const commentaryPhrases = [
  "ياااااا الله",
  "هدف!",
  "تصدي رائع",
  "تمريرة ممتازة",
  "انطلق!",
  "قرب الهدف",
  "الحكم يتفقد VAR",
  "اللعب مستمر"
];

function showCommentary(text) {
  // display as message and speak in Arabic if available
  showMessage(text, 2000);
  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ar-SA';
    utter.rate = 1.0;
    utter.pitch = 1.0;
    window.speechSynthesis.speak(utter);
  }
}

/* =========================
   CROWD & TIFO
   ========================= */
let crowdAudioCtx = null;
let crowdGain = null;
function initCrowdAudio() {
  try {
    crowdAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 4096;
    const noise = crowdAudioCtx.createScriptProcessor(bufferSize, 1, 1);
    noise.onaudioprocess = function(e) {
      const output = e.outputBuffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++) {
        // pink-ish crowd noise
        output[i] = (Math.random()*2-1) * 0.15;
      }
    };
    crowdGain = crowdAudioCtx.createGain();
    crowdGain.gain.value = 0.2;
    noise.connect(crowdGain);
    crowdGain.connect(crowdAudioCtx.destination);
  } catch (err) {
    console.warn('AudioContext not available', err);
  }
}
function playCrowdCheer() {
  if (!crowdAudioCtx) initCrowdAudio();
  if (!crowdGain) return;
  // quick cheer by increasing gain
  const now = crowdAudioCtx.currentTime;
  crowdGain.gain.cancelScheduledValues(now);
  crowdGain.gain.setValueAtTime(0.2, now);
  crowdGain.gain.linearRampToValueAtTime(1.0, now + 0.1);
  crowdGain.gain.linearRampToValueAtTime(0.2, now + 1.2);
}

/* Tifo: 5000 small planes forming logo */
function initTifo() {
  const ctx = tifoCanvas.getContext('2d');
  function resize() {
    tifoCanvas.width = window.innerWidth;
    tifoCanvas.height = Math.floor(window.innerHeight * 0.35);
  }
  resize();
  window.addEventListener('resize', resize);
  // We'll render tifo as canvas of small rectangles; to form logo, we sample logo image into grid
  const logoImg = new Image();
  logoImg.crossOrigin = "anonymous";
  logoImg.src = LOGO_URLS[selectedTeams.LEFT] || Object.values(LOGO_URLS)[0];
  logoImg.onload = () => {
    const w = 200, h = 80;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.drawImage(logoImg, 0, 0, w, h);
    const data = octx.getImageData(0,0,w,h).data;
    // draw grid of 5000 rectangles mapping to logo pixels
    const cols = 100;
    const rows = 50;
    const cellW = tifoCanvas.width / cols;
    const cellH = tifoCanvas.height / rows;
    for (let y=0;y<rows;y++) {
      for (let x=0;x<cols;x++) {
        const sx = Math.floor(x/cols * w);
        const sy = Math.floor(y/rows * h);
        const idx = (sy*w + sx)*4;
        const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
        ctx.fillStyle = `rgba(${r},${g},${b},${a/255})`;
        ctx.fillRect(x*cellW, y*cellH, cellW, cellH);
      }
    }
  };
}

/* =========================
   CAMERA: third-person behind active player
   ========================= */
function updateCamera(delta) {
  if (activePlayer) {
    // position camera slightly high behind player
    const target = new THREE.Vector3().copy(activePlayer.position);
    const behind = new THREE.Vector3(0, 3.5, 6);
    // rotate behind based on player's facing (approx)
    const camPos = new THREE.Vector3().copy(activePlayer.position).add(new THREE.Vector3(0,3.5,6));
    camera.position.lerp(camPos, 0.1);
    camera.lookAt(target.x, target.y+1.2, target.z);
  } else {
    // default overview
    const defaultPos = new THREE.Vector3(0, 18, 28);
    camera.position.lerp(defaultPos, 0.05);
    camera.lookAt(0,0,0);
  }
}

/* =========================
   MATCH TIMER & ADDED TIME
   ========================= */
let lastTick = performance.now();
function startMatchClock() {
  currentMatchSeconds = 0;
  addedTime = 0;
  lastTick = performance.now();
  timeScaleConfig = 60; // default: 1 real second = 1 in-game minute
}

/* compute added time at 45:00 */
function computeAddedTime() {
  // simple heuristic: base 1 minute + random up to 6 based on attacks/injuries/VAR
  const base = 1;
  const extra = Math.floor(Math.random()*7);
  return base + extra;
}

/* =========================
   INPUT MAPPING DURING MATCH
   ========================= */
function handleControllerInputDuringMatch() {
  const gps = navigator.getGamepads();
  controllers.forEach(c=>{
    if (!c.connected || !c.joined) return;
    const gp = gps[c.index];
    if (!gp) return;
    // map left stick to movement if this controller controls a player on its side
    // find controlled player: if playerIndex assigned, map to that index; else first available
    const side = c.side;
    const team = side === 'LEFT' ? teams.LEFT : teams.RIGHT;
    const idx = c.playerIndex !== null ? c.playerIndex : 0;
    const player = team.players[idx];
    if (!player) return;
    // left stick axes 0 (x), 1 (y)
    const lx = gp.axes[0];
    const ly = gp.axes[1];
    // move player
    player.position.x += lx * 0.2;
    player.position.z += ly * 0.2;
    // buttons
    if (gp.buttons[0].pressed) { // X = pass
      // simple pass: find nearest teammate
      const mates = team.players.filter(p=>p!==player);
      if (mates.length>0) {
        let nearest = mates[0];
        let md = player.position.distanceTo(nearest.position);
        mates.forEach(m=>{
          const d = player.position.distanceTo(m.position);
          if (d < md) { md = d; nearest = m; }
        });
        // pass ball
        const dir = new THREE.Vector3().subVectors(nearest.position, player.position).normalize();
        ballVelocity.copy(dir.multiplyScalar(6));
        possession = team === teams.LEFT ? 'LEFT' : 'RIGHT';
        activePlayer = nearest;
      }
    }
    if (gp.buttons[1].pressed) { // Circle = shoot
      attemptShot(player, 1.0);
    }
    if (gp.buttons[2].pressed) { // Square = cross
      // cross: send ball wide
      const dir = new THREE.Vector3((Math.random()-0.5)*0.6,0, (player.position.z>0? -1:1)).normalize();
      ballVelocity.copy(dir.multiplyScalar(8));
      possession = null;
    }
    if (gp.buttons[3].pressed) { // Triangle = through pass
      const dir = new THREE.Vector3((Math.random()-0.5)*0.2,0, (player.position.z>0? -1:1)).normalize();
      ballVelocity.copy(dir.multiplyScalar(9));
      possession = null;
    }
    if (gp.buttons[7].value > 0.1) { // R2 = power shot (analog)
      // hold and release logic not implemented in single frame; use value as multiplier
      // if pressed with Circle, will be handled above
    }
    if (gp.buttons[4].pressed) { // L1 = sprint
      player.position.add(new THREE.Vector3(lx*0.6,0,ly*0.6));
    }
    if (gp.buttons[5].pressed) { // R1 = switch player
      // cycle player index
      c.playerIndex = ((c.playerIndex||0) + 1) % team.players.length;
      showMessage('Switched player');
    }
  });
}

/* =========================
   MAIN LOOP
   ========================= */
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let delta = (now - lastTick) / 1000;
  lastTick = now;

  // poll controllers for join while in start screen
  if (!matchRunning) {
    pollGamepadsForJoin();
  } else {
    // match running: update clock scaled by timeScaleConfig
    const inGameSeconds = delta * timeScaleConfig;
    currentMatchSeconds += inGameSeconds;
    // update HUD time display
    const minutes = Math.floor(currentMatchSeconds / 60);
    const seconds = Math.floor(currentMatchSeconds % 60);
    timeEl.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    // if reached 45 minutes and not yet computed added time
    if (minutes >= 45 && addedTime === 0) {
      addedTime = computeAddedTime();
      showMessage(`Added time: ${addedTime} minutes`);
    }
    // end match when beyond 45 + addedTime
    if (minutes >= 45 + addedTime) {
      endMatch();
    }

    // gameplay ticks
    handleControllerInputDuringMatch();
    aiTick(delta);
    physicsTick(delta);
    updateCamera(delta);
  }

  renderer.render(scene, camera);
}
animate();

/* =========================
   MATCH INIT & END
   ========================= */
function initMatch() {
  spawnPlayers();
  initCrowdAudio();
  initTifo();
  startMatchClock();
  showCommentary('انطلاق المباراة');
  // set initial scores
  teams.LEFT.score = 0; teams.RIGHT.score = 0;
  scoreLeftEl.textContent = '0'; scoreRightEl.textContent = '0';
  // set HUD names
  teamLeftNameEl.textContent = selectedTeams.LEFT;
  teamRightNameEl.textContent = selectedTeams.RIGHT;
  // enable camera follow
  controls.enabled = false;
  // assign controllers to players if joined
  controllers.forEach(c=>{
    if (c.connected && c.joined) {
      // assign to side players
      const side = c.side;
      const team = side === 'LEFT' ? teams.LEFT : teams.RIGHT;
      c.playerIndex = c.playerIndex || 0;
      // if multiple controllers on same side, they share team
    }
  });
}

/* End match */
function endMatch() {
  matchRunning = false;
  showCommentary('نهاية الشوط');
  showMessage('Match ended. Final score: ' + teams.LEFT.score + ' - ' + teams.RIGHT.score, 8000);
  // show start panel again for rematch
  setTimeout(()=> {
    startPanel.style.display = 'block';
    hud.style.display = 'none';
  }, 3000);
}

/* =========================
   Window resize
   ========================= */
window.addEventListener('resize', ()=> {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

/* =========================
   Extra: Keyboard fallback controls for testing
   ========================= */
window.addEventListener('keydown', (e)=>{
  if (!matchRunning) {
    if (e.key === '1') {
      // simulate controller 1 connect & join
      controllers[0].connected = true; controllers[0].joined = true; controllers[0].side='LEFT';
      renderControllerSlots();
    }
    if (e.key === '2') {
      controllers[1].connected = true; controllers[1].joined = true; controllers[1].side='RIGHT';
      renderControllerSlots();
    }
  } else {
    // during match: keyboard controls for testing active player
    if (e.key === ' ') {
      // shoot from center
      if (activePlayer) attemptShot(activePlayer, 1.0);
    }
  }
});
