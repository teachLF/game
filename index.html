<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Saudi League 5 - DLS 26 Edition</title>
<style>
  html,body{height:100%;margin:0;background:#07121a;color:#fff;font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  #canvas{display:block;width:100vw;height:100vh}
  #ui{position:absolute;left:12px;top:12px;z-index:60;pointer-events:none}
  .panel{background:rgba(0,0,0,0.6);padding:12px;border-radius:8px;margin-bottom:8px;pointer-events:auto}
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70}
  #scoreboard{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:70;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:8px}
  #varOverlay{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:80;pointer-events:none}
  #varOverlay .text{background:rgba(0,0,0,0.7);padding:20px;border-radius:10px;font-size:36px;color:#ffeb3b}
</style>

<!-- importmap Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div id="startPanel" class="panel">
    <div style="font-size:20px;font-weight:700">Saudi League 5 - DLS 26 Edition</div>
    <div style="margin-top:8px">وصل وحدات التحكم حتى 6. اضغط X للانضمام، D‑pad لاختيار الجانب.</div>
    <div id="slots" style="margin-top:8px"></div>
    <div style="margin-top:8px">
      <button id="toTeam" style="padding:8px 12px;border-radius:6px;background:#0b6;color:#002;border:none;cursor:pointer">التالي: اختيار الفرق</button>
    </div>
  </div>

  <div id="teamPanel" class="panel" style="display:none">
    <div style="font-size:18px;font-weight:700">اختيار الفرق</div>
    <div id="teamChoices" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"></div>
    <div style="margin-top:8px">
      <button id="toFormation" style="padding:8px 12px;border-radius:6px;background:#0b6;color:#002;border:none;cursor:pointer">التالي: التشكيل</button>
    </div>
  </div>

  <div id="formationPanel" class="panel" style="display:none">
    <div style="font-size:18px;font-weight:700">اختيار التشكيل</div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="formation" data-f="4-4-2" style="padding:8px 12px;border-radius:6px;background:#0b6;color:#002;border:none;cursor:pointer">4-4-2</button>
      <button class="formation" data-f="4-3-3" style="padding:8px 12px;border-radius:6px;background:#0b6;color:#002;border:none;cursor:pointer">4-3-3</button>
      <button class="formation" data-f="3-5-2" style="padding:8px 12px;border-radius:6px;background:#0b6;color:#002;border:none;cursor:pointer">3-5-2</button>
      <button class="formation" data-f="5-3-2" style="padding:8px 12px;border-radius:6px;background:#0b6;color:#002;border:none;cursor:pointer">5-3-2</button>
    </div>
    <div style="margin-top:8px">
      <button id="startMatch" style="padding:8px 12px;border-radius:6px;background:#f4d03f;color:#002;border:none;cursor:pointer">ابدأ المباراة</button>
    </div>
  </div>
</div>

<div id="scoreboard" style="display:none">
  <span id="time">00:00</span> — <span id="score">0 - 0</span>
</div>

<div id="varOverlay" style="display:none"><div class="text">VAR CHECK</div></div>

<!-- تحميل السكربتات -->
<script type="module">
  import { initApp } from './app.js';
  initApp();
</script>
</body>
</html>
